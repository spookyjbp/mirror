name: Build Eden for Windows

# Run it from the Actions tab (Run workflow), or push to this branch.
on:
  workflow_dispatch:
  push:
    branches: [mod-home-profiles]

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: .\tools\windows\install-vulkan-sdk.ps1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and Ninja
        shell: pwsh
        run: python -m pip install --upgrade "cmake>=3.31" ninja

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYUZU_TESTS=OFF -DENABLE_UPDATE_CHECKER=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Upload Eden
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Windows-x64-home-menu-profiles
          path: build/bin/
          if-no-files-found: error
